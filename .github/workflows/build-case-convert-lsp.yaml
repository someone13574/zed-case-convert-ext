name: Build case-convert-lsp
permissions: write-all
on:
  release:
    types:
      - published

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: case-convert-lsp-linux-x64.tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: case-convert-lsp-windows-x64.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: "dtolnay/rust-toolchain@v1"
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Run cargo build
        run: cargo build --release -p case-convert-lsp --target=${{ matrix.target }}

      - name: Create archive
        if: runner.os != 'Windows'
        run: |
          mv target/${{ matrix.target }}/release/case-convert-lsp case-convert-lsp
          tar -czvf ${{ matrix.asset }} case-convert-lsp

      - name: Create archive
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/${{ matrix.target }}/release/case-convert-lsp.exe -DestinationPath ${{ matrix.asset }}

      - name: Add asset to release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.asset }}
